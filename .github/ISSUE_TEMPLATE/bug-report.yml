name: '🐛 Bug Report'
description: File a bug report to help us improve @nx-electron-forge.
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much information as possible.

  - type: dropdown
    id: package
    attributes:
      label: 📦 Affected Package
      description: Which package is this bug related to?
      options:
        - '@nx-electron-forge/ipc'
        - '@nx-electron-forge/core'
        - '@nx-electron-forge/forge'
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 🏷️ Package Version
      description: The version of the package where the bug occurs.
      placeholder: 'e.g., 1.0.0'
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 🔄 Reproduction Steps
      description: Provide a link to a reproduction repo, or clear steps to reproduce this bug.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 🎯 Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 💻 Environment Context
      description: |
        Please provide your runtime environment info.
        Note: We target ES2022 and strictly support Electron >= 24, Node >= 18, and TS >= 5.0.
      placeholder: |
        - OS: Windows 11 / macOS / Ubuntu
        - Electron Version (Required >= 24):
        - Node.js Version (Required >= 18):
        - TypeScript Version (Required >= 5.0):
    validations:
      required: true

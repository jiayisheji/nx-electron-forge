name: '✨ Feature Request'
description: Suggest a new idea or feature for @nx-electron-forge.
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve this project? We'd love to hear it! Please outline your proposal below.
  - type: textarea
    id: problem
    attributes:
      label: ❓ Is your feature request related to a problem?
      description: A clear and concise description of what the problem is. (e.g. I am frustrated when...)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 💡 Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 🔄 Describe alternatives you've considered
      description: A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    id: context
    attributes:
      label: 🎨 Additional Context
      description: Any other context, code examples, or screenshots about the feature request here.
